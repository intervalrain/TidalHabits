name: TidalHabits
options:
  bundleIdPrefix: com.intervalrain
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: zh-Hant
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  SWIFT_VERSION: "5.9"
  MARKETING_VERSION: "0.2.0"
  CURRENT_PROJECT_VERSION: 1

targets:
  TidalHabits:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: src
        name: Sources
        type: group
        createIntermediateGroups: true
    resources:
      - path: src/App/Assets.xcassets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.intervalrain.TidalHabits
      INFOPLIST_FILE: src/App/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      DEVELOPMENT_TEAM: "" # Add your team ID here
      CODE_SIGN_STYLE: Automatic
      SWIFT_VERSION: "5.9"
      TARGETED_DEVICE_FAMILY: "1,2" # iPhone and iPad
    scheme:
      testTargets:
        - TidalHabitsTests
        - TidalHabitsUITests
      gatherCoverageData: true
    preBuildScripts:
      - name: SwiftLint
        script: |
          if which swiftlint >/dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
          fi
        basedOnDependencyAnalysis: false

  TidalHabitsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: test/TidalHabitsTests
        name: Tests
        type: group
        createIntermediateGroups: true
    dependencies:
      - target: TidalHabits
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.intervalrain.TidalHabitsTests
      SWIFT_VERSION: "5.9"
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TidalHabits.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TidalHabits"
      BUNDLE_LOADER: "$(TEST_HOST)"
    scheme:
      gatherCoverageData: true

  TidalHabitsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: test/TidalHabitsUITests
        name: UI Tests
        type: group
        createIntermediateGroups: true
    dependencies:
      - target: TidalHabits
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.intervalrain.TidalHabitsUITests
      SWIFT_VERSION: "5.9"
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: TidalHabits
    scheme:
      gatherCoverageData: true

schemes:
  TidalHabits:
    build:
      targets:
        TidalHabits: all
        TidalHabitsTests: [test]
        TidalHabitsUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - TidalHabitsTests
        - TidalHabitsUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
